[bind.default]

# reload config
"SUPER+r" = "reload_config"

# menu and terminal
"Alt+Return" = "spawn,foot"
"Alt+space" = "spawn,noctalia msg panel-toggle launcher"

# exit super+m
"SUPER+m" = "quit"
# killclient super+q
"ALT+q" = "killclient"

# switch window focus
"SUPER+Tab" = "focusstack,next"
"SUPER+u" = "focuslast"
"ALT+Left" = "focusdir,left"
"ALT+Right" = "focusdir,right"
"ALT+Up" = "focusdir,up"
"ALT+Down" = "focusdir,down"

# swap window
"SUPER+SHIFT+Up" = "exchange_client,up"
"SUPER+SHIFT+Down" = "exchange_client,down"
"SUPER+SHIFT+Left" = "exchange_client,left"
"SUPER+SHIFT+Right" = "exchange_client,right"

# movewin
"CTRL+SHIFT+Up" = "movewin,+0,-50"
"CTRL+SHIFT+Down" = "movewin,+0,+50"
"CTRL+SHIFT+Left" = "movewin,-50,+0"
"CTRL+SHIFT+Right" = "movewin,+50,+0"

# resizewin
"CTRL+ALT+Up" = "resizewin,+0,-50"
"CTRL+ALT+Down" = "resizewin,+0,+50"
"CTRL+ALT+Left" = "resizewin,-50,+0"
"CTRL+ALT+Right" = "resizewin,+50,+0"

# switch window status
"SUPER+g" = "toggleglobal"
"ALT+Tab" = "toggleoverview"
"ALT+backslash" = "togglefloating"
"ALT+a" = "togglemaximizescreen"
"ALT+f" = "togglefullscreen"
"ALT+SHIFT+f" = "togglefakefullscreen"
"SUPER+i" = "minimized"
"SUPER+o" = "toggleoverlay"
"SUPER+SHIFT+I" = "restore_minimized"
"ALT+z" = "toggle_scratchpad"

# scroller layout
"ALT+e" = "set_proportion,1.0"
"ALT+x" = "switch_proportion_preset"

# tile layout
"SUPER+e" = "incnmaster,1"
"SUPER+t" = "incnmaster,-1"
"ALT+s" = "zoom"

# switch layout
"CTRL+SUPER+i" = "setlayout,tile"
"CTRL+SUPER+l" = "setlayout,scroller"
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+Left" = "viewtoleft,0"
"CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
"CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"

# view - switch to workspace (tag)
"Super+1" = "view,1,0"
"Super+2" = "view,2,0"
"Super+3" = "view,3,0"
"Super+4" = "view,4,0"
"Super+5" = "view,5,0"
"Super+6" = "view,6,0"
"Super+7" = "view,7,0"
"Super+8" = "view,8,0"
"Super+9" = "view,9,0"

# tag - assign current window to tag
"Alt+1" = "tag,1,0"
"Alt+2" = "tag,2,0"
"Alt+3" = "tag,3,0"
"Alt+4" = "tag,4,0"
"Alt+5" = "tag,5,0"
"Alt+6" = "tag,6,0"
"Alt+7" = "tag,7,0"
"Alt+8" = "tag,8,0"
"Alt+9" = "tag,9,0"

# toggletag - mirror window across tags
"ctrl+Super+1" = "toggletag,1"
"ctrl+Super+2" = "toggletag,2"
"ctrl+Super+3" = "toggletag,3"
"ctrl+Super+4" = "toggletag,4"
"ctrl+Super+5" = "toggletag,5"
"ctrl+Super+6" = "toggletag,6"
"ctrl+Super+7" = "toggletag,7"
"ctrl+Super+8" = "toggletag,8"
"ctrl+Super+9" = "toggletag,9"

# toggleview - view multiple tags simultaneously
"ctrl+1" = "toggleview,1"
"ctrl+2" = "toggleview,2"
"ctrl+3" = "toggleview,3"
"ctrl+4" = "toggleview,4"
"ctrl+5" = "toggleview,5"
"ctrl+6" = "toggleview,6"
"ctrl+7" = "toggleview,7"
"ctrl+8" = "toggleview,8"
"ctrl+9" = "toggleview,9"

# monitor switch
"alt+shift+Left" = "focusmon,left"
"alt+shift+Right" = "focusmon,right"
"alt+shift+Up" = "focusmon,up"
"alt+shift+Down" = "focusmon,down"
"SUPER+Alt+Left" = "tagmon,left"
"SUPER+Alt+Right" = "tagmon,right"
"SUPER+Alt+Up" = "tagmon,up"
"SUPER+Alt+Down" = "tagmon,down"

# gaps
"ALT+SHIFT+X" = "incgaps,1"
"ALT+SHIFT+Z" = "incgaps,-1"
"ALT+SHIFT+R" = "togglegaps"

# brightness (Noctalia)
"CTRL+comma" = "spawn,noctalia msg brightness-down"
"CTRL+period" = "spawn,noctalia msg brightness-up"
"XF86MonBrightnessUp" = "spawn,noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn,noctalia msg brightness-down"

# volume (Noctalia)
"ALT+comma" = "spawn,noctalia msg volume-down"
"ALT+period" = "spawn,noctalia msg volume-up"
"XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
"XF86AudioMute" = "spawn,noctalia msg volume-mute"

# playback and media (Noctalia)
"XF86AudioPrev" = "spawn,noctalia msg media previous"
"XF86AudioNext" = "spawn,noctalia msg media next"
"XF86AudioPlay" = "spawn,noctalia msg media toggle"
"CTRL+grave" = "spawn,noctalia msg media toggle"
"XF86AudioMicMute" = "spawn,noctalia msg mic-mute"

# color-picker
"CTRL+ALT+p" = "spawn,noctalia msg panel-toggle oldirtty/color_picker:panel"

# custom app bindings
"ALT+t" = "spawn,thunar"
"CTRL+SUPER+Return" = "spawn,foot -e yazi"
"CTRL+ALT+a" = "spawn_shell,grim -g \"$(slurp -b '#2E2A1E55' -c '#fb751bff')\" -t ppm - | satty -f -"
"CTRL+ALT+r" = "spawn_shell,pkill -SIGINT wf-recorder || wf-recorder -g \"$(slurp -b '#2E2A1E55' -c '#fb751bff')\" -f ~/Downloads/recording_$(date +%Y-%m-%d_%H-%M-%S).mp4"
"SUPER+l" = "spawn,noctalia msg session lock"
"SUPER+s" = "spawn_shell,mmsg dispatch view,4; spotifast"

# noctalia plugins
"SUPER+F1" = "spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet"


[mousebind.default]

# Mouse Button Bindings
"SUPER+btn_left" = "moveresize,curmove"
"alt+btn_middle" = "set_proportion,0.5"
"SUPER+btn_right" = "moveresize,curresize"
"SUPER+CTRL+btn_left" = "minimized"
"SUPER+CTRL+btn_right" = "killclient"
"SUPER+CTRL+btn_middle" = "togglefullscreen"


[axisbind.default]

# Axis Bindings
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
"alt+UP" = "focusdir,left"
"alt+DOWN" = "focusdir,right"
"shift+super+UP" = "exchange_client,left"
"shift+super+DOWN" = "exchange_client,right"


[gesturebind.default]

# Gesture bindings
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+left+4" = "viewtoleft_have_client"
"none+right+4" = "viewtoright_have_client"
"none+up+4" = "toggleoverview,1"
"none+down+4" = "toggleoverview,1"
