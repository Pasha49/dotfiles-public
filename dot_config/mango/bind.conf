# reload config
#bind=SUPER,c,spawn_shell,bash ~/.config/mango/scripts/config_check.sh
#bind=SUPER,c,spawn_shell,mango -c ~/.config/mango/config.conf -p
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,Return,spawn,foot
#launcher
#bind=Alt,space,spawn,dms ipc call spotlight toggle
bind=Alt,space,spawn,noctalia msg panel-toggle launcher

# exit super+m
bind=SUPER,m,quit
# killclient super+q
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,u,focuslast
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0


# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# tile layout
bind=SUPER,e,incnmaster,1
bind=SUPER,t,incnmaster,-1
bind=ALT,s,zoom,

# switch layout
bind=CTRL+SUPER,i,setlayout,tile
bind=CTRL+SUPER,l,setlayout,scroller
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

#view - прееключиться на воркспейс(тэг)
bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0

#tag - назначить текущему окну тег(view)
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

#toggletag - повторить окно в теге, полная копия, как симлинк
bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9

#toggleview - увидеть сразу несколько видов, временно. Например тэг 1 + тэг 2
bind=ctrl,1,toggleview,1
bind=ctrl,2,toggleview,2
bind=ctrl,3,toggleview,3
bind=ctrl,4,toggleview,4
bind=ctrl,5,toggleview,5
bind=ctrl,6,toggleview,6
bind=ctrl,7,toggleview,7
bind=ctrl,8,toggleview,8
bind=ctrl,9,toggleview,9

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
#mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=alt,UP,focusdir,left
axisbind=alt,DOWN,focusdir,right
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right

# Gesturebind
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# brightness
#dms
#bind=CTRL,comma,spawn,dms ipc call brightness decrement 2 ""
#bind=CTRL,period,spawn,dms ipc call brightness increment 2 ""
#bind=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 1
#bind=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 1
#noctalia
bind=CTRL,comma,spawn,noctalia msg brightness-down
bind=CTRL,period,spawn,noctalia msg brightness-up
bind=none,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=none,XF86MonBrightnessDown,spawn,noctalia msg brightness-down



#volume
#dms
#bind=ALT,comma,spawn,dms ipc call audio decrement 3
#bind=ALT,period,spawn,dms ipc call audio increment 3
#bind=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
#bind=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
#bind=NONE,XF86AudioMute,spawn,dms ipc call audio mute
#noctalia
bind=ALT,comma,spawn,noctalia msg volume-down
bind=ALT,period,spawn,noctalia msg volume-up
bind=none,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=none,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=none,XF86AudioMute,spawn,noctalia msg volume-mute


#Playback
#system
#bind=NONE,XF86AudioNext,spawn,playerctl next
#bind=NONE,XF86AudioPrev,spawn,playerctl previous
#bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
#dms
#bind=NONE,XF86AudioPrev,spawn,dms ipc call mpris previous
#bind=NONE,XF86AudioNext,spawn,dms ipc call mpris next
#bind=NONE,XF86AudioPlay,spawn,dms ipc call mpris playPause
#bind=CTRL,grave,spawn,dms ipc call mpris playPause
#noctalia
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=CTRL,grave,spawn,noctalia msg media toggle
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute


#color-picker
#bind=CTRL+ALT,p,spawn,dms color pick
bind=CTRL+ALT,p,spawn,noctalia msg panel-toggle oldirtty/color_picker:panel

#custom app bind
#bind=SUPER,Return,spawn,google-chrome
bind=ALT,t,spawn,thunar
bind=CTRL+SUPER,Return,spawn,foot -e yazi
bind=CTRL+ALT,a,spawn_shell,grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -t ppm - | satty -f -
bind=CTRL+ALT,r,spawn_shell,pkill -SIGINT wf-recorder || wf-recorder -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" -f ~/Downloads/recording_$(date +%Y-%m-%d_%H-%M-%S).mp4
#bind=SUPER,h,spawn,bash ~/.config/mango/scripts/hide_waybar_mango.sh
#bind=SUPER,l,spawn,dms ipc call lock lock
bind=SUPER,l,spawn,noctalia msg session lock
bind=SUPER,s,spawn_shell,mmsg dispatch view,4; spotifast


#noctalia plugins
bind=SUPER,F1,spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet
