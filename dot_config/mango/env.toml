[env]
# Input method framework
GTK_IM_MODULE = "fcitx"
QT_IM_MODULE = "fcitx"
SDL_IM_MODULE = "fcitx"
XMODIFIERS = "@im=fcitx"
GLFW_IM_MODULE = "ibus"

# Qt appearance and scaling
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
#QT_WAYLAND_FORCE_DPI = "140"

# Wayland platform backend
QT_QPA_PLATFORM = "wayland;xcb"

