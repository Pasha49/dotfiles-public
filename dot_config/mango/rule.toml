# Window Rules

# Flameshot
[[rule.window_rule]]
no_swallow = 1
app_id = "flameshot"

[[rule.window_rule]]
is_fullscreen = 1
app_id = "flameshot"

[[rule.window_rule]]
animation_type_open = "none"
app_id = "flameshot"

[[rule.window_rule]]
animation_type_close = "none"
app_id = "flameshot"

# Blueman manager
[[rule.window_rule]]
is_floating = 1
width = 1500
height = 900
app_id = "blueman-manager"

#xdg-desktop
[[rule.window_rule]]
is_floating = 1
app_id = "xdg-desktop-portal-gtk"

# Spotifast
[[rule.window_rule]]
is_floating = 1
width = 1600
height = 950
app_id = "spotifast"

# Animation rules for specific applications
[[rule.window_rule]]
animation_type_open = "slide"
app_id = "Rofi"

[[rule.window_rule]]
animation_type_close = "zoom"
app_id = "Rofi"

[[rule.window_rule]]
animation_type_open = "zoom"
app_id = "qxdrag.py"

[[rule.window_rule]]
animation_type_open = "zoom"
app_id = "python3"
title = "qxdrag"

[[rule.window_rule]]
animation_type_close = "zoom"
app_id = "qxdrag.py"

[[rule.window_rule]]
animation_type_close = "zoom"
app_id = "python3"
title = "qxdrag"

[[rule.window_rule]]
animation_type_close = "zoom"
app_id = "^com.gabm.satty$"

# Workspace tag assignments and behavior
[[rule.window_rule]]
is_tag_silent = 1
app_id = "org.telegram.desktop"

[[rule.window_rule]]
tags = 4
app_id = "spotifast"

[[rule.window_rule]]
tags = 3
app_id = "firefox"

[[rule.window_rule]]
tags = 2
app_id = "mpv"

[[rule.window_rule]]
tags = 6
app_id = "obs"

[[rule.window_rule]]
tags = 5
app_id = "org.telegram.desktop"

[[rule.window_rule]]
force_fake_maximize = 1
app_id = "firefox"

[[rule.window_rule]]
force_fake_maximize = 1
app_id = "org.telegram.desktop"

# Opacity rules
[[rule.window_rule]]
unfocused_opacity = 1.0
focused_opacity = 1.0
app_id = "^mpv$"

[[rule.window_rule]]
unfocused_opacity = 0.95
focused_opacity = 1.0
app_id = "^foot$"

[[rule.window_rule]]
unfocused_opacity = 1.0
focused_opacity = 1.0
app_id = "^obsidian$"

[[rule.window_rule]]
unfocused_opacity = 0.95
focused_opacity = 1.0
app_id = "^firefox$"

[[rule.window_rule]]
unfocused_opacity = 0.75
focused_opacity = 0.9
app_id = "^spotifast$"


# Layer Rules

[[rule.layer_rule]]
no_blur = 1
no_animation = 1
layer_name = "selection"

[[rule.layer_rule]]
no_blur = 1
no_shadow = 1
layer_name = "noctalia.*"

[[rule.layer_rule]]
no_blur = 1
no_animation = 1
layer_name = "dms"

[[rule.layer_rule]]
no_blur = 1
no_animation = 1
layer_name = "dms:.*"

[[rule.layer_rule]]
no_blur = 1
no_animation = 1
layer_name = "dimland_layer"

[[rule.layer_rule]]
no_animation = 1
no_blur = 1
no_shadow = 1
layer_name = "hyprpicker"

[[rule.layer_rule]]
no_animation = 1
layer_name = "showkeys"
