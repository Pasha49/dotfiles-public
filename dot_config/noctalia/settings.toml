config_version = 14

[accessibility]
ui_scale = 1.2000000104308128

[bar.default]
center = [ "clock", "weather" ]
end = [
    "tray",
    "status_2",
    "group:g1",
    "bar_2",
    "widget",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "status",
    "control-center",
    "session"
]
margin_ends = 50
padding = 6
scale = 1.2000000104308128
start = [ "launcher", "group:g3", "widget_3", "wallpaper", "wallhaven", "bar", "bar_3", "group:g2", "widget_2" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "secondary"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "ram", "cpu", "network_rx", "network_tx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "media" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "workspaces", "btn" ]
    opacity = 1.0
    padding = 6.0

[brightness]
sync_all_monitors = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 144.0
    box_width = 240.0
    cx = 928.0
    cy = 212.0
    output = "HDMI-A-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background_opacity = 0.53000000000000003

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[nightlight]
enabled = true
temperature_day = 6100

[osd.kinds]
lock_keys = false

[plugin_settings."ezequiel/mango_layouts"]
panel_position = "top_left"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 6

[plugins]
enabled = [
    "ezequiel/mango_layouts",
    "prponkshe/mango-displays",
    "gambled23/mangowm-keymode",
    "oldirtty/color_picker",
    "aristides/udiskie",
    "yuuto/arch-updater",
    "icefish/phone-connect",
    "noctalia/timer",
    "kenn/keybind-cheatsheet",
    "3ri4ng0ld/ip-monitor",
    "noctalia/wallhaven",
    "alexander/screen-toolkit",
    "davemhammer/tailscale",
    "blackbartblues/audio-switcher"
]

[shell]
external_ip_enabled = true
password_style = "random"
polkit_agent = true
telemetry_enabled = true

    [shell.animation]
    enabled = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Murata"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[widget.audio_visualizer]
enabled = false

[widget.bar]
type = "prponkshe/mango-displays:bar"

[widget.bar_2]
enabled = false
type = "icefish/phone-connect:bar"

[widget.bar_3]
show_idle_on_horizontal = false
type = "noctalia/timer:bar"

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.clock]
capsule = true
format = "  {:%H:%M - %a %d.%m}"

[widget.cpu]
label_show_units = false
visualization = "none"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.network_rx]
color = "tertiary"
network_speed_compact = true
network_speed_unit = "mb"
visualization = "none"

[widget.network_tx]
color = "primary"
network_speed_compact = true
network_speed_unit = "mb"
visualization = "none"

[widget.ram]
label_show_units = false
stat = "ram_pct"
visualization = "none"

[widget.status]
type = "aristides/udiskie:status"

[widget.status_2]
flag_problem = true
font_scale = 0.90000000000000013
type = "davemhammer/tailscale:status"

[widget.tray]
capsule = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
show_condition = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.widget_2]
custom_command = "echo \"$(curl -s ipinfo.io/country)\""
enabled = false
glyph = ""
interactive = false
mode = "custom_command"
refresh_interval = 342
text_color = "tertiary"
type = "3ri4ng0ld/ip-monitor:widget"

[widget.widget_3]
type = "alexander/screen-toolkit:widget"

[widget.workspaces]
inactive_pill_size = 0.55000000000000004
labels_only_when_occupied = true
pill_scale = 0.90000000000000002